<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PROMATEC Arquitectura. Nueva web en construcción.">
  <title>PROMATEC Arquitectura</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
    }
    .page {
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(rgba(0,0,0,.46), rgba(0,0,0,.46)),
        url("oficina-promatec.jpg") center center / cover no-repeat;
    }
    .content {
      width: min(92%, 900px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: 52px 20px 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo {
      width: min(300px, 62vw);
      height: auto;
      display: block;
    }
    .hero { margin-top: 245px; }
    h1 {
      margin: 0;
      font-size: clamp(26px, 3.1vw, 42px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .divider {
      width: 380px;
      max-width: 58vw;
      height: 2px;
      margin: 28px auto 29px;
      background: rgba(255,255,255,.8);
    }
    h2 {
      margin: 0;
      font-size: clamp(25px, 2.9vw, 40px);
      line-height: 1.2;
      font-weight: 700;
    }
    .message {
      margin: 28px 0 0;
      font-size: clamp(18px, 2vw, 26px);
      line-height: 1.55;
    }
    .contact {
      margin-top: 27px;
      font-size: clamp(18px, 2vw, 26px);
      line-height: 1.45;
    }
    .contact a {
      display: inline-block;
      margin-top: 7px;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    @media (max-width: 700px) {
      .content { padding-top: 34px; }
      .hero { margin-top: 190px; }
      .divider { margin-top: 22px; margin-bottom: 23px; }
      .message { margin-top: 22px; }
      .contact { margin-top: 22px; }
    }
    @media (max-height: 760px) {
      .hero { margin-top: 130px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="content">
      <img class="logo" src="logo-promatec-claro.png" alt="PROMATEC Arquitectura">
      <div class="hero">
        <h1>TUS IDEAS, NUESTROS ESPACIOS</h1>
        <div class="divider"></div>
        <h2>Nueva web en construcción</h2>
        <p class="message">
          Estamos preparando nuestra nueva web.<br>
          Muy pronto podrás conocer nuestros proyectos y servicios.
        </p>
        <div class="contact">
          ¿Quieres ponerte en contacto con nosotros?<br>
          <a href="tel:+34652808648">Tel. 652 80 86 48</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
