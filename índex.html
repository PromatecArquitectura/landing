<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PROMATEC Arquitectura</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #111111;
      color: white;
      text-align: center;
    }

    .contenedor {
      padding: 40px 25px;
      max-width: 700px;
    }

    .logo {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 5px;
      margin-bottom: 15px;
    }

    .linea {
      width: 70px;
      height: 2px;
      background: white;
      margin: 25px auto;
    }

    h1 {
      font-size: 30px;
      font-weight: 400;
      margin-bottom: 15px;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
      color: #cccccc;
    }

    .pie {
      margin-top: 45px;
      font-size: 13px;
      color: #888888;
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <div class="logo">PROMATEC</div>

    <div class="linea"></div>

    <h1>Nueva web en construcción</h1>

    <p>
      Estamos preparando nuestra nueva web.
      <br>
      Muy pronto podrás conocer nuestros proyectos y servicios.
    </p>

    <div class="pie">
      PROMATEC Arquitectura
    </div>

  </main>

</body>
</html>
